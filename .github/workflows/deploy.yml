name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize the complete run, including approval, so an older approval cannot
# deploy after a newer run. Pending runs may be replaced; this is not a FIFO.
concurrency:
  group: homelog-production
  cancel-in-progress: false

jobs:
  backend-quality:
    uses: ./.github/workflows/backend-workers-ci.yml

  frontend-quality:
    uses: ./.github/workflows/frontend-ci.yml

  e2e:
    uses: ./.github/workflows/e2e.yml

  deploy:
    needs: [backend-quality, frontend-quality, e2e]
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend-workers
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend-workers/package-lock.json
            frontend/package-lock.json

      - name: Install Workers dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Deliberately differs from Issue #265: build before any remote DB change.
      - name: Build frontend before production changes
        working-directory: frontend
        run: npm run build

      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
