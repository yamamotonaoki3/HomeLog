name: homelog

services:
  db:
    image: postgres:17
    container_name: homelog-db
    environment:
      POSTGRES_DB: homelog
      POSTGRES_USER: homelog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - homelog-db-data:/var/lib/postgresql/data

volumes:
  homelog-db-data:
