name = "homelog-backend-workers"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

# ローカル開発専用のデフォルト値。本番ではwrangler secret putで上書きし、
# このファイルには実際のシークレット値を書かないこと。
[vars]
JWT_SECRET = "homelog-workers-local-dev-secret-key-32chars-min"
JWT_ACCESS_EXPIRATION_SECONDS = "900"
JWT_REFRESH_EXPIRATION_SECONDS = "604800"

# ローカル開発用のD1データベース定義。
# 本番用のdatabase_idはCloudflareダッシュボードでD1を作成後に設定する（Phase 6で対応）。
[[d1_databases]]
binding = "DB"
database_name = "homelog-db"
database_id = "local-placeholder"
migrations_dir = "drizzle"
