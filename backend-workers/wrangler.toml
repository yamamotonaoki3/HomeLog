name = "homelog-backend-workers"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

# 起動・テスト・dry-run前にfrontendでnpm run buildを実行する。
[assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*", "/health"]

# JWT_SECRETのような真のシークレットはvarsに書かず、.dev.vars(gitignore対象、
# .dev.vars.exampleを参照して各自作成)またはwrangler secret putで管理する。
# varsは非シークレットな設定値のみを置く。
[vars]
JWT_ACCESS_EXPIRATION_SECONDS = "900"
JWT_REFRESH_EXPIRATION_SECONDS = "604800"
# メール送信基盤(今後の検討事項)が実装されるまでのローカル開発専用フラグ。デフォルトはfalse。
# 有効にするとパスワードリセットの生トークンがログに出力されるため、共有・本番環境では絶対にtrueにしないこと。
APP_PASSWORD_RESET_LOG_TOKEN_ENABLED = "false"

# D1データベース定義。
# 本番D1(homelog-db)のID。秘密情報ではない。ローカル開発は --local で別の模擬DBを使う。
[[d1_databases]]
binding = "DB"
database_name = "homelog-db"
database_id = "23786409-7730-4076-9aa2-d84fb198d4ca"
migrations_dir = "drizzle"

# OCR用画像の一時保存先(#132)。ローカル開発・テストではwranglerの模擬R2を使い、実バケットには接続しない。
[[r2_buckets]]
binding = "RECIPE_IMAGES"
bucket_name = "homelog-recipe-images"

# OCR結果の整形に使うWorkers AI(#132)。模擬版が無くローカル実行でも実AIを呼ぶため、テストではモックに差し替える。
[ai]
binding = "AI"
remote = true

# 固定費の毎月自動計上バッチ。既存JavaのFixedCostPostingService
# (@Scheduled(cron = "0 0 1 * * *", zone = "Asia/Tokyo"))相当。
# JSTは夏時間が無いため、UTC 16:00固定 = JST 01:00で問題ない。
[triggers]
# 献立の期限切れ削除はJST 00:00。JST 01:00の既存処理でも再試行する。
crons = ["0 15 * * *", "0 16 * * *"]
